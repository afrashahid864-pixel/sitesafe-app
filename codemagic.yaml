workflows:
  android-release:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Create Android folder if missing
        script: |
          flutter create .
          echo "environment:\n  sdk: '>=3.3.0 <4.0.0'" >> pubspec.yaml
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk